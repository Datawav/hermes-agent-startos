name: Operations liveness scripts

on:
  workflow_dispatch:
  push:
    paths:
      - 'operations/**'
      - '.github/workflows/operations-liveness.yml'
  pull_request:
    paths:
      - 'operations/**'
      - '.github/workflows/operations-liveness.yml'

permissions:
  contents: read

concurrency:
  group: operations-liveness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-integration:
    name: Fast integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run exact fast integration gate
        run: python operations/ci_fast.py
